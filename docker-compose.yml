services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: feedwall
    restart: unless-stopped
    ports:
      # loopback only: FreshRSS is not exposed to the LAN
      - "127.0.0.1:8970:80"
    volumes:
      - ./data:/var/www/FreshRSS/data
      - ./extensions:/var/www/FreshRSS/extensions
    environment:
      TZ: America/New_York
      # refresh all feeds every 20 min (in-container cron)
      CRON_MIN: '*/20'
      # one-shot auto-provision so there's no web wizard on first boot
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url http://localhost:8970
        --default-user mooteo
        --language en
      # credentials come from .env (gitignored; see .env.example). Only used
      # when the user is first created; to rotate, use cli/update-user.php.
      FRESHRSS_USER: |-
        --user mooteo
        --password ${FRESHRSS_PASSWORD:?set FRESHRSS_PASSWORD in .env}
        --api-password ${FEEDWALL_API_PASS:?set FEEDWALL_API_PASS in .env}
