name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - name: tests (no network, Ollama and FreshRSS are mocked)
        run: python -m pytest -q
      - name: quickstart renders a briefing from the demo DB
        env:
          FEEDWALL_DB: examples/demo.sqlite
        run: |
          python -m briefing.render --stdout --as-of 2026-01-15T07:00+00:00 | tee briefing.md
          grep -q "## What moved" briefing.md
          git diff --exit-code examples/demo.sqlite
